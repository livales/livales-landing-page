[build]
  # Astro writes every page as its own HTML file (produk.html, en/products.html,
  # blog/<slug>.html, …); Netlify serves them at /produk, /en/products, … with
  # no trailing-slash redirect, so the URLs match the canonical ones.
  command = "npm run build"
  publish = "dist"

# Send the default Netlify address to the real domain, so search engines see
# one site instead of a duplicate at livales.netlify.app. Deploy previews
# (deploy-preview-N--livales.netlify.app) use other hostnames and are unaffected;
# Netlify already marks them noindex.
[[redirects]]
  from = "https://livales.netlify.app/*"
  to = "https://livales.com/:splat"
  status = 301
  force = true

# @astrojs/sitemap writes sitemap-index.xml; the old address (submitted to
# Search Console and in older robots.txt copies) keeps working.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# No SPA fallback. Unknown paths get a real 404 status: the English 404 page
# under /en, and 404.html (Indonesian) everywhere else, which Netlify serves on
# its own. Without force, existing files under /en are still served as usual.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
