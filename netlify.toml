[build]
  # `npm run build` also prerenders the home page into dist/index.html (SEO).
  command = "npm run build"
  publish = "dist"

# Send the default Netlify address to the real domain, so search engines see
# one site instead of a duplicate at livales.netlify.app. Deploy previews
# (deploy-preview-N--livales.netlify.app) use other hostnames and are unaffected;
# Netlify already marks them noindex.
[[redirects]]
  from = "https://livales.netlify.app/*"
  to = "https://livales.com/:splat"
  status = 301
  force = true

# No SPA fallback: every page is prerendered to its own file (produk.html,
# blog/<slug>.html, …), and unknown paths get 404.html with a real 404 status.
