  <body>
    <script>
      // Hide .reveal content before first paint; if the app never boots,
      // show everything again so the page is never left blank.
      document.documentElement.classList.add("reveal-ready");
      setTimeout(function () {
        if (!window.__revealReady) document.documentElement.classList.remove("reveal-ready");
      }, 3000);
    </script>
