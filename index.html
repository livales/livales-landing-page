<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Livales — Software yang Mendekatkan</title>
    <meta
      name="description"
      content="Livales membuat software yang mendekatkan: dengan orang tersayang, dan dengan bahasa baru. Coba Kana Speed, belajar bahasa Jepang gratis."
    />
    <meta name="author" content="Livales" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://livales.com/" />

    <!-- Google Search needs a square icon of at least 48x48 (multiples of 48). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Livales — Software yang Mendekatkan" />
    <meta
      property="og:description"
      content="Perusahaan teknologi dari Indonesia yang membuat software yang mendekatkan. Coba Kana Speed untuk belajar bahasa Jepang."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Livales" />
    <meta property="og:url" content="https://livales.com/" />
    <meta property="og:image" content="https://livales.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Livales" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Livales — Software yang Mendekatkan" />
    <meta
      name="twitter:description"
      content="Perusahaan teknologi dari Indonesia yang membuat software yang mendekatkan. Coba Kana Speed untuk belajar bahasa Jepang."
    />
    <meta name="twitter:image" content="https://livales.com/og-image.png" />
    <meta name="twitter:image:alt" content="Logo Livales" />

    <!-- Structured data: lets search engines identify the company, its logo and profiles -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://livales.com/#organization",
            "name": "Livales",
            "url": "https://livales.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://livales.com/brand/icon-512.png",
              "width": 512,
              "height": 512
            },
            "description": "Perusahaan teknologi dari Indonesia yang merancang dan membangun software sendiri: software yang mendekatkan dengan orang tersayang, dan dengan bahasa serta budaya baru.",
            "areaServed": "ID",
            "sameAs": ["https://www.linkedin.com/company/livales/"],
            "owns": { "@id": "https://kana.livales.com/#app" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://kana.livales.com/#app",
            "name": "Kana Speed",
            "url": "https://kana.livales.com/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "inLanguage": ["id", "en"],
            "description": "Belajar bahasa Jepang gratis dengan kuis interaktif: hiragana, katakana, salam, perkenalan diri, angka, dan waktu.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
            "publisher": { "@id": "https://livales.com/#organization" }
          },
          {
            "@type": "WebSite",
            "@id": "https://livales.com/#website",
            "name": "Livales",
            "url": "https://livales.com/",
            "inLanguage": ["id", "en"],
            "publisher": { "@id": "https://livales.com/#organization" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
