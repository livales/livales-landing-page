<!doctype html>
<!--
  Source of public/og-image.png (Indonesian) and public/og-image-en.png (English), 1200 × 630.
  Flat, per README → Brand → Visual system: white page, ink tagline, a soft green field
  with the logo's embrace around a family. Render both with headless Chrome:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=public/og-image.png "file://$PWD/scripts/og-image.html?lang=id"
  (and ?lang=en → public/og-image-en.png). The logo is the official file, not redrawn.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&family=Unbounded:wght@600&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #122023; }
      body { display: grid; grid-template-columns: 1fr 400px; }
      .copy { display: flex; flex-direction: column; justify-content: space-between; padding: 72px 64px 64px 80px; }
      .logo { height: 52px; width: auto; align-self: flex-start; }
      h1 { font: 600 54px/1.14 Unbounded, sans-serif; letter-spacing: -0.02em; text-wrap: balance; }
      .url { font: 500 26px/1 Figtree, sans-serif; color: rgba(18, 32, 35, 0.65); }
      .field { background: #e6f5e3; display: flex; align-items: center; justify-content: center; }
      .field svg { width: 270px; height: auto; }
    </style>
  </head>
  <body>
    <div class="copy">
      <img class="logo" src="../public/brand/livales-logo.svg" alt="" />
      <h1 id="tagline"></h1>
      <p class="url">livales.com</p>
    </div>
    <div class="field">
      <!-- Embrace "family" (src/components/brand/Embrace.astro) -->
      <svg viewBox="0 0 164 112" aria-hidden="true">
        <rect x="0" y="86" width="158" height="26" rx="13" fill="#f07c8f" />
        <rect x="0" y="0" width="26" height="112" rx="13" fill="#122023" />
        <circle cx="54" cy="56" r="20" fill="#2ecc40" />
        <circle cx="100" cy="56" r="20" fill="#f07c8f" />
        <circle cx="138" cy="74" r="11" fill="#122023" />
      </svg>
    </div>
    <script>
      const taglines = {
        id: "Lebih dekat dengan orang tersayang, dan dunia yang ingin kamu kenal.",
        en: "Closer to the people you love, and the world you want to know.",
      };
      const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "id";
      document.documentElement.lang = lang;
      document.getElementById("tagline").textContent = taglines[lang];
    </script>
  </body>
</html>
